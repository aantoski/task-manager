<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Task Helper</title>
  <meta name="description" content="Daily tasks, groups and recurring chores.">
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111318" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Tasks">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="main"></main>

  <button class="fab" id="fab" aria-label="New task">+</button>

  <nav class="tabbar">
    <a href="#today" data-view="today">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      Today
    </a>
    <a href="#groups" data-view="groups">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      Groups
    </a>
    <a href="#chores" data-view="chores">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg>
      Chores
    </a>
    <a href="#more" data-view="more">
      <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
      More
    </a>
  </nav>

  <dialog id="taskDialog">
    <form method="dialog" id="taskForm">
      <h2 id="taskDialogTitle">New task</h2>
      <label>Title <input name="title" required autocomplete="off"></label>
      <label>Group <select name="groupId"></select></label>
      <label class="row"><input type="checkbox" name="repeat"> Repeating chore</label>
      <div class="repeat-fields">
        <label>Repeat
          <span class="inline">every <input type="number" name="every" min="1" inputmode="numeric"> days</span>
        </label>
        <label>Last completed on <input type="date" name="lastDone"></label>
      </div>
      <div class="once-fields">
        <label>Due date (optional) <input type="date" name="due"></label>
        <label class="row"><input type="checkbox" name="today"> On my Today list</label>
      </div>
      <label>Notes <textarea name="notes" rows="3"></textarea></label>
      <div class="actions">
        <button type="button" class="btn danger" id="deleteTask">Delete</button>
        <span class="spacer"></span>
        <button type="button" class="btn" data-close>Cancel</button>
        <button class="btn primary" value="save">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="groupDialog">
    <form method="dialog" id="groupForm">
      <h2 id="groupDialogTitle">New group</h2>
      <label>Name <input name="name" required autocomplete="off"></label>
      <fieldset class="swatches" id="swatches"><legend>Color</legend></fieldset>
      <label class="row"><input type="checkbox" name="choreDefault"> New tasks here are repeating chores</label>
      <div class="actions">
        <button type="button" class="btn danger" id="deleteGroup">Delete</button>
        <span class="spacer"></span>
        <button type="button" class="btn" data-close>Cancel</button>
        <button class="btn primary" value="save">Save</button>
      </div>
    </form>
  </dialog>

  <input type="file" id="importFile" accept="application/json,.json" hidden>
  <div class="toast" id="toast" role="status" hidden></div>

  <script src="app.js"></script>
</body>
</html>
